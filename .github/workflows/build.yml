name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-x64
            os: macos-latest
            args: --mac --x64
          - name: macos-arm64
            os: macos-latest
            args: --mac --arm64
          - name: macos-universal
            os: macos-latest
            args: --mac --universal
          - name: windows-x64
            os: windows-latest
            args: --win --x64
          - name: windows-arm64
            os: windows-latest
            args: --win --arm64
          - name: linux-x64
            os: ubuntu-latest
            args: --linux --x64
          - name: linux-arm64
            os: ubuntu-latest
            args: --linux --arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist -- ${{ matrix.args }}
      - uses: actions/upload-artifact@v7
        with:
          name: ClaudeUsage-${{ matrix.name }}
          path: |
            dist/ClaudeUsage-*
            !dist/*.blockmap
          if-no-files-found: error
