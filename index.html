<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Claude 사용량</title>
  <style>
    :root {
      --bg: rgba(250, 249, 245, 0.94);
      --fg: #1f1e1d;
      --muted: #73726c;
      --border: rgba(0, 0, 0, 0.1);
      --track: rgba(0, 0, 0, 0.08);
      --ok: #d97757;
      --warn: #c98a12;
      --crit: #d64545;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: rgba(31, 30, 29, 0.92);
        --fg: #f5f4ef;
        --muted: #a3a19b;
        --border: rgba(255, 255, 255, 0.1);
        --track: rgba(255, 255, 255, 0.1);
      }
    }

    html, body { margin: 0; background: transparent; overflow: hidden; }
    body {
      font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
        "Malgun Gothic", "Noto Sans KR", sans-serif;
      color: var(--fg);
      user-select: none;
      cursor: default;
    }

    .card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      -webkit-app-region: drag;
    }

    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    h1 { margin: 0; font-size: 12px; font-weight: 600; }
    #refresh {
      -webkit-app-region: no-drag;
      border: 0; background: none; padding: 0 2px;
      color: var(--muted); font: inherit; font-size: 14px; cursor: pointer;
    }
    #refresh:hover { color: var(--fg); }
    #refresh.spin { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .row + .row { margin-top: 8px; }
    .line { display: flex; align-items: baseline; gap: 6px; }
    .label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .reset { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .pct { font-weight: 600; font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }
    .bar { height: 5px; margin-top: 3px; border-radius: 3px; background: var(--track); overflow: hidden; }
    .fill { height: 100%; border-radius: 3px; background: var(--ok); }
    .warn .fill { background: var(--warn); }
    .crit .fill { background: var(--crit); }
    .crit .pct { color: var(--crit); }

    footer { margin-top: 8px; color: var(--muted); font-size: 10.5px; }
    #error { color: var(--crit); }
    #error:empty { display: none; }
    #login {
      -webkit-app-region: no-drag;
      display: block;
      width: 100%;
      margin: 8px 0 2px;
      padding: 6px 0;
      border: 0;
      border-radius: 7px;
      background: var(--ok);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    #login:hover { filter: brightness(1.08); }
    #login[hidden] { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <h1>Claude 사용량</h1>
      <button id="refresh" title="새로고침">↻</button>
    </header>
    <div id="rows"></div>
    <footer>
      <div id="error"></div>
      <button id="login" hidden>claude.ai 로그인</button>
      <div id="updated">불러오는 중…</div>
    </footer>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
